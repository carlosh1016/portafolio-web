<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="Recibos App">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Recibo / factura escaneada -->
  <g>
    <rect x="90" y="70" width="230" height="310" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#2dd4bf" stroke-opacity="0.35"/>
    <!-- encabezado del recibo -->
    <rect x="120" y="100" width="120" height="16" rx="8" fill="url(#accent)"/>
    <rect x="120" y="128" width="170" height="10" rx="5" fill="#ffffff" fill-opacity="0.12"/>
    <line x1="120" y1="156" x2="290" y2="156" stroke="#ffffff" stroke-opacity="0.1"/>
    <!-- lineas de items -->
    <rect x="120" y="176" width="110" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.14"/>
    <rect x="250" y="176" width="40" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.14"/>
    <rect x="120" y="200" width="130" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.14"/>
    <rect x="255" y="200" width="35" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.14"/>
    <rect x="120" y="224" width="95" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.14"/>
    <rect x="250" y="224" width="40" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.14"/>
    <line x1="120" y1="252" x2="290" y2="252" stroke="#ffffff" stroke-opacity="0.1"/>
    <!-- total -->
    <rect x="120" y="272" width="60" height="12" rx="6" fill="#ffffff" fill-opacity="0.2"/>
    <rect x="220" y="272" width="70" height="12" rx="6" fill="url(#accent)"/>
    <!-- NIT -->
    <rect x="120" y="320" width="150" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.1"/>
    <rect x="120" y="342" width="110" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.1"/>
    <!-- linea de escaneo OCR -->
    <rect x="90" y="150" width="230" height="70" fill="url(#scan)"/>
    <line x1="90" y1="220" x2="320" y2="220" stroke="#2dd4bf" stroke-width="2"/>
  </g>

  <!-- flecha de exportacion -->
  <g stroke="url(#accent)" stroke-width="4" fill="none">
    <line x1="345" y1="225" x2="430" y2="225"/>
    <polyline points="410,208 432,225 410,242"/>
  </g>
  <text x="388" y="200" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#2dd4bf" font-weight="bold">OCR</text>

  <!-- Hoja de Excel -->
  <g>
    <rect x="460" y="90" width="270" height="270" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#22c55e" stroke-opacity="0.4"/>
    <!-- barra verde tipo excel -->
    <rect x="460" y="90" width="270" height="34" rx="12" fill="#22c55e" fill-opacity="0.18"/>
    <rect x="480" y="101" width="90" height="12" rx="6" fill="#22c55e"/>
    <!-- filas y columnas -->
    <g stroke="#ffffff" stroke-opacity="0.1">
      <line x1="460" y1="160" x2="730" y2="160"/>
      <line x1="460" y1="196" x2="730" y2="196"/>
      <line x1="460" y1="232" x2="730" y2="232"/>
      <line x1="460" y1="268" x2="730" y2="268"/>
      <line x1="460" y1="304" x2="730" y2="304"/>
      <line x1="550" y1="124" x2="550" y2="360"/>
      <line x1="640" y1="124" x2="640" y2="360"/>
    </g>
    <!-- celda encabezado destacada -->
    <rect x="460" y="124" width="270" height="36" fill="#22c55e" fill-opacity="0.12"/>
    <rect x="475" y="136" width="55" height="10" rx="5" fill="#22c55e"/>
    <rect x="565" y="136" width="55" height="10" rx="5" fill="#22c55e"/>
    <rect x="655" y="136" width="55" height="10" rx="5" fill="#22c55e"/>
    <!-- datos -->
    <g fill="#ffffff" fill-opacity="0.14">
      <rect x="475" y="172" width="55" height="9" rx="4.5"/>
      <rect x="565" y="172" width="45" height="9" rx="4.5"/>
      <rect x="655" y="172" width="50" height="9" rx="4.5"/>
      <rect x="475" y="208" width="50" height="9" rx="4.5"/>
      <rect x="565" y="208" width="55" height="9" rx="4.5"/>
      <rect x="655" y="208" width="40" height="9" rx="4.5"/>
      <rect x="475" y="244" width="55" height="9" rx="4.5"/>
      <rect x="565" y="244" width="40" height="9" rx="4.5"/>
      <rect x="655" y="244" width="50" height="9" rx="4.5"/>
      <rect x="475" y="280" width="48" height="9" rx="4.5"/>
      <rect x="565" y="280" width="52" height="9" rx="4.5"/>
      <rect x="655" y="280" width="45" height="9" rx="4.5"/>
    </g>
  </g>

  <text x="760" y="420" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#2dd4bf" font-weight="bold">Recibos App · OCR → Excel</text>
</svg>
