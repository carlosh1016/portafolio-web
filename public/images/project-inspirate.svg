<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="Inspirate Inventory">
  <defs>
    <linearGradient id="bg-inspirata" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent-purple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="accent-pink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg-inspirata)"/>

  <!-- Botellas de perfume (izquierda) -->
  <g>
    <!-- Botella 1 -->
    <rect x="60" y="140" width="35" height="100" rx="8" fill="#a855f7" fill-opacity="0.7" stroke="#a855f7" stroke-width="1" stroke-opacity="0.6"/>
    <ellipse cx="77.5" cy="145" rx="17.5" ry="6" fill="#a855f7" fill-opacity="0.9"/>
    <rect x="73" y="130" width="9" height="15" fill="#8b5cf6"/>

    <!-- Botella 2 -->
    <rect x="115" y="120" width="35" height="120" rx="8" fill="#ec4899" fill-opacity="0.7" stroke="#ec4899" stroke-width="1" stroke-opacity="0.6"/>
    <ellipse cx="132.5" cy="125" rx="17.5" ry="6" fill="#ec4899" fill-opacity="0.9"/>
    <rect x="128" y="110" width="9" height="15" fill="#f43f5e"/>

    <!-- Botella 3 -->
    <rect x="170" y="150" width="35" height="90" rx="8" fill="#a855f7" fill-opacity="0.6" stroke="#a855f7" stroke-width="1" stroke-opacity="0.5"/>
    <ellipse cx="187.5" cy="155" rx="17.5" ry="6" fill="#8b5cf6" fill-opacity="0.8"/>
    <rect x="183" y="140" width="9" height="15" fill="#7c3aed"/>
  </g>

  <!-- Panel central - Sistema de ventas -->
  <g>
    <!-- Contenedor principal -->
    <rect x="240" y="80" width="320" height="280" rx="16" fill="#ffffff" fill-opacity="0.04" stroke="#8b5cf6" stroke-width="2" stroke-opacity="0.3"/>

    <!-- Encabezado -->
    <rect x="240" y="80" width="320" height="50" rx="16" fill="#8b5cf6" fill-opacity="0.12"/>
    <rect x="260" y="95" width="140" height="14" rx="7" fill="#a855f7" fill-opacity="0.8"/>

    <!-- Línea separadora -->
    <line x1="260" y1="150" x2="540" y2="150" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

    <!-- Items del carrito -->
    <rect x="260" y="165" width="130" height="12" rx="6" fill="#ffffff" fill-opacity="0.1"/>
    <rect x="400" y="165" width="60" height="12" rx="6" fill="#ffffff" fill-opacity="0.1"/>

    <rect x="260" y="190" width="150" height="12" rx="6" fill="#ffffff" fill-opacity="0.1"/>
    <rect x="420" y="190" width="40" height="12" rx="6" fill="#ffffff" fill-opacity="0.1"/>

    <rect x="260" y="215" width="120" height="12" rx="6" fill="#ffffff" fill-opacity="0.1"/>
    <rect x="390" y="215" width="70" height="12" rx="6" fill="#ffffff" fill-opacity="0.1"/>

    <!-- Línea separadora -->
    <line x1="260" y1="245" x2="540" y2="245" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

    <!-- Total -->
    <rect x="260" y="260" width="70" height="14" rx="7" fill="#ffffff" fill-opacity="0.1"/>
    <rect x="340" y="260" width="100" height="14" rx="7" fill="#ec4899" fill-opacity="0.8"/>

    <!-- Botón pagar -->
    <rect x="260" y="290" width="260" height="45" rx="10" fill="none" stroke="#a855f7" stroke-width="2" stroke-opacity="0.6"/>
    <text x="390" y="318" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#a855f7" font-weight="bold">Procesar Venta</text>
  </g>

  <!-- Panel derecho - Inventario y reportes -->
  <g>
    <!-- Contenedor inventario -->
    <rect x="595" y="80" width="165" height="135" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.3"/>

    <!-- Encabezado -->
    <rect x="610" y="92" width="70" height="10" rx="5" fill="#a855f7" fill-opacity="0.7"/>
    <rect x="610" y="110" width="40" height="8" rx="4" fill="#ffffff" fill-opacity="0.1"/>
    <rect x="660" y="110" width="30" height="8" rx="4" fill="#ec4899" fill-opacity="0.7"/>

    <rect x="610" y="130" width="50" height="8" rx="4" fill="#ffffff" fill-opacity="0.1"/>
    <rect x="670" y="130" width="20" height="8" rx="4" fill="#ffffff" fill-opacity="0.1"/>

    <rect x="610" y="150" width="55" height="8" rx="4" fill="#ffffff" fill-opacity="0.1"/>
    <rect x="675" y="150" width="25" height="8" rx="4" fill="#ffffff" fill-opacity="0.1"/>

    <!-- Contenedor gráfico -->
    <rect x="595" y="235" width="165" height="125" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ec4899" stroke-width="1.5" stroke-opacity="0.3"/>

    <!-- Barras del gráfico -->
    <rect x="610" y="290" width="18" height="50" rx="4" fill="#a855f7" fill-opacity="0.8"/>
    <rect x="635" y="275" width="18" height="65" rx="4" fill="#ec4899" fill-opacity="0.8"/>
    <rect x="660" y="300" width="18" height="40" rx="4" fill="#a855f7" fill-opacity="0.6"/>
    <rect x="685" y="270" width="18" height="70" rx="4" fill="#ec4899" fill-opacity="0.6"/>

    <!-- Eje X -->
    <line x1="610" y1="345" x2="710" y2="345" stroke="#ffffff" stroke-opacity="0.08"/>
  </g>

  <!-- Ícono de sincronización -->
  <circle cx="720" cy="180" r="15" fill="none" stroke="#a855f7" stroke-width="2" stroke-opacity="0.6"/>
  <path d="M 710 170 L 720 180 L 710 190" fill="none" stroke="#a855f7" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6"/>

  <!-- Título del proyecto -->
  <text x="400" y="410" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#a855f7" font-weight="bold">Inspirate Inventory · Gestión de Stock</text>
</svg>
